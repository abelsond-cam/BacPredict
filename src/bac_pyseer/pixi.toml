# Standalone pixi environment for the bac_pyseer variant-collation + GWAS toolchain.
#
# Provides bcftools (+ samtools for `faidx`), used by the per-sample pipeline in
# extract_sample_loci.py and by reference staging, plus **pyseer** (the GWAS engine we
# shell out to). Kept separate from the repo's uv env so the bioconda toolchain never
# perturbs the Python library deps — pyseer drags in its own numpy/scipy/scikit-learn,
# which would otherwise fight Bacformer's pinned pytorch stack — and, crucially, so we
# never `module load` bcftools on CSD3 (the spack module leaks a python-3.9 site-packages
# dir onto PYTHONPATH, which breaks uv's python 3.12 numpy import).
#
# The Python worker runs under `uv run python`; it shells out to this env's bcftools via
# the absolute path passed as `--bcftools` (conda binaries find their htslib via RPATH, so
# no LD_LIBRARY_PATH/module is needed). The GWAS is driven through the env's console
# scripts `pyseer` and `scree_plot_pyseer`; our own post-processing (diagnostics, gene
# mapping) runs back under `uv run python`, taking pyseer's `.assoc` as plain text input.
# Run pixi commands from this directory:
#
#   cd src/bac_pyseer && pixi install
#   pixi run bcftools --version
#   pixi run pyseer --version              # linux-64 only (see target below)
#   pixi run scree_plot_pyseer distances.tsv --max-dimensions 30
#
# The installed env binaries live at:
#   src/bac_pyseer/.pixi/envs/default/bin/{bcftools,samtools,pyseer,scree_plot_pyseer}
#
# pyseer is scoped to the linux-64 target: the GWAS only ever runs on the HPC (its inputs
# are ~10 GB on RDS, and our own post-processing runs under uv), so there is no reason to
# force an osx-arm64 solve for it — the Mac env stays the lean bcftools/samtools toolchain.
#
# Note: filter output is version-robust — bcftools 1.14 (CSD3 module) reproduces the
# collaborators' bcftools-1.21 native snps.vcf exactly — so the version is left loose.

[workspace]
name = "bac-pyseer-tools"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
bcftools = ">=1.18"
samtools = ">=1.18"
htslib = ">=1.18"

# The GWAS engine + unitig builders — HPC-only (see header). console scripts: `pyseer`,
# `scree_plot_pyseer`, `ggcat`, `unitig-caller`. These build a compacted de Bruijn graph across
# the cohort assemblies → a unitig presence/absence matrix (the accessory/HGT feature space the
# reference-anchored variant GWAS can't see).
#   * ggcat — the builder of record. Disk-based and memory-capped (`-m`), so it does NOT OOM on
#     the ~18k-genome union (built coloured with `-d Sample<TAB>path`; see ggcat_to_pyseer.py).
#   * unitig-caller (Bifrost backend) — kept for reference, but OOMs (>503 GB) at the union scale
#     on a 502 GB himem node, which is why ggcat replaced it.
[target.linux-64.dependencies]
pyseer = ">=1.3.11"
ggcat = ">=2.2.0"
unitig-caller = ">=1.3.0"
